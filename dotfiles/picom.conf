#################################
#             Backend           #
#################################

# Backend to use: "xrender", "glx", or "egl".
# GLX is recommended for NVIDIA proprietary drivers (GeForce GTX 1660 SUPER).
backend = "glx";

# Use damage information for rendering to only redraw changed parts of the screen.
# Essential in modern picom for performance and low resource usage.
use-damage = true;

# Use X Sync fence to sync buffer swaps with the X server.
# Set to true if you encounter delay/stutter on NVIDIA GLX.
xrender-sync-fence = false;

# Enable VSync to eliminate screen tearing.
vsync = true;

#################################
#           Shadows             #
#################################

# Client-side shadows (disabled to match your compton configuration).
shadow = false;

#################################
#           Fading              #
#################################

# Fade windows in/out when opening/closing and when opacity changes.
fading = true;

# Opacity change between steps while fading in and out (snappy 3-frame fade).
fade-in-step = 0.33;
fade-out-step = 0.33;

# Time between steps in fade step, in milliseconds.
fade-delta = 16;

#################################
#       General Settings        #
#################################

# Use EWMH _NET_ACTIVE_WINDOW to determine currently focused window.
use-ewmh-active-win = true;

# Detect rounded corners on windows.
detect-rounded-corners = true;

# Detect _NET_WM_WINDOW_OPACITY on client windows.
detect-client-opacity = true;

# Group transient windows and consider them focused together.
detect-transient = true;

# Unredirect fullscreen opaque windows to maximize performance (e.g. for games).
unredir-if-possible = true;

#################################
#            Rules              #
#################################

# Modern window rules syntax (supersedes legacy 'wintypes' and '*_exclude' lists).
rules = (
  {
    match = "window_type = 'tooltip'";
    fade = true;
    shadow = false;
    opacity = 0.8;
    focus = true;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
  }
);
